name: Desktop build

on:
  push:
    branches: [main, codex/dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: Repository checks
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_changes.py
      - name: Require a development branch for pull requests
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if ($env:HEAD_BRANCH -in @('main', 'master')) {
            throw 'Create a development branch before opening a pull request.'
          }
      - name: Check Git hooks
        shell: bash
        run: bash scripts/test-git-hooks.sh
      - name: Check build selection
        run: python scripts/test_ci_changes.py
      - name: Install the repository toolchain
        if: steps.changes.outputs.build == 'true'
        run: rustup show active-toolchain
      - name: Check Rust formatting
        if: steps.changes.outputs.build == 'true'
        run: cargo fmt --all -- --check

  core:
    name: Core / no GUI dependencies
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - name: Verify architecture boundaries
        run: |
          python scripts/check_architecture.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_architecture.py
      - name: Test core without GUI or platform libraries
        run: cargo test --locked -p tydaro-core

  windows:
    name: Windows x64 / MSVC Release
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
      # Never cache both debug and release dependency graphs on Windows. The
      # source hash refreshes immutable caches; the prefix reuses dependencies.
      - name: Cache Rust dependencies and Release outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/x86_64-pc-windows-msvc/release
          key: rust-v2-windows-2022-msvc-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'src/**', 'crates/**', 'assets/**', 'build.rs', '.cargo/**', 'scripts/**', '.github/workflows/**') }}
          restore-keys: |
            rust-v2-windows-2022-msvc-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            rust-v2-windows-2022-msvc-release-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Find the Windows SDK shader compiler
        run: ./scripts/windows-sdk.ps1
      - name: Check Rust lints in the Release profile
        run: cargo clippy --locked --workspace --release --all-targets --target x86_64-pc-windows-msvc --features test-support -- -D warnings
      - name: Run model and workspace tests in the Release profile
        run: cargo test --locked --workspace --release --all-targets --target x86_64-pc-windows-msvc --features test-support
      - name: Build native interaction regressions
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --features test-support --bin tydaro
      - name: Verify workspace and Gallery interactions
        timeout-minutes: 15
        run: ./scripts/test-windows-smoke.ps1
      - name: Upload Windows interaction logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tydaro-windows-smoke-${{ github.sha }}
          path: artifacts/windows-smoke/*.log
          if-no-files-found: warn
          retention-days: 14
      # Rebuild without test-support before packaging the distributable.
      - name: Build the distributable application
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin tydaro
      - name: Package executable and SHA-256 checksum
        run: ./scripts/package-windows.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tydaro-windows-x86_64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # The distributable is already a ZIP archive.

  ci:
    name: CI
    if: always()
    needs: [checks, core, windows]
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_REQUIRED: ${{ needs.checks.outputs.build }}
          CORE_RESULT: ${{ needs.core.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if ($env:CHECKS_RESULT -ne 'success') { throw 'Repository checks failed.' }
          if ($env:BUILD_REQUIRED -eq 'true') {
            if ($env:CORE_RESULT -ne 'success' -or $env:WINDOWS_RESULT -ne 'success') {
              throw 'Required Windows verification did not succeed.'
            }
          } elseif ($env:BUILD_REQUIRED -eq 'false') {
            # Known documentation, or a codex/dev push covered by the matching
            # open PR. PR runs always validate their own merge commit normally.
            if ($env:CORE_RESULT -ne 'skipped' -or $env:WINDOWS_RESULT -ne 'skipped') {
              throw 'Unexpected build results for an exempt change.'
            }
          } else {
            throw 'Missing or invalid build selection.'
          }
