[package]
name = "tydaro"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A customizable native stock workspace powered by Rust and GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
encoding_rs = "=0.8.42"
gpui-kit = { version = "=0.7.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
test-support = ["gpui-kit/test-support"]

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = "debuginfo"

[[bin]]
name = "tydaro"
path = "src/main.rs"
